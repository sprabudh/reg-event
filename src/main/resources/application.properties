spring.datasource.url=jdbc:postgresql://localhost:5434/eventdb
spring.datasource.username=eventuser
spring.datasource.password=eventpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Origins the browser may call this API from. Vite auto-increments to 5174,
# 5175, ... when 5173 is already taken, which silently breaks every API call
# with a CORS preflight 403. List the ports you actually run the frontend on.
application.security.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# HOST accounts may only register with this email domain. Leave blank to
# disable the rule. The role is still the real security boundary; this is a
# signup business rule on top of it.
application.security.auth.host-email-domain=@eventora.com

